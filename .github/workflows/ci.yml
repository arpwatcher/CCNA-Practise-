name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # every lab's model answer is replayed against the engine
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # the page in a real browser: labs typed in, tip jar, phone layout
      - run: npm run smoke

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # the site is served from the gh-pages branch: each green push to main
    # replaces it with what the browser needs (no tests, tools or node_modules)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir site
          cp -r index.html app.js style.css topo.js support.js favicon.svg og.png engine labs site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site build of main ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
